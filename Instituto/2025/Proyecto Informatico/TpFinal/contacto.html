<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="py-1 px-0 d-flex">
      <div class="col-md-4 align-items-center d-flex">
        <a href="index.html" class="text-decoration-none">
        <img src="Imagenes/logo.png" alt="" class="ms-2 float-start tamaño_img">
        </a>
        <a href="index.html" class="text-decoration-none">
        <h1 class="fs-1 text-light ms-2">Promiedos</h1>
        </a>
      </div>
      <div class="col-md-4  align-items-center d-flex">
        <div class="mx-auto ">
          <a href="opciones.html"><button class="bg-white ancho rounded-3 border-0 alto fs-5">Ligas</button></a>
        </div>  
      </div>
      
      
      <div class="col-md-4 align-items-center d-flex">
        <nav class="position-absolute end-0 me-4 d-flex gap-4">
          <a href="tablas.html" target="_self"><img src="Imagenes/datos.png" alt="" class="icono-nav"></a>
          <a href="contacto.html" ><img src="Imagenes/contacto.png" alt="" class="icono-nav"></a>
        </nav>
      </div>
    </header>
  <main>
    <div class="container-fluid d-flex justify-content-center align-items-center content-center">
      <div class="contact-form-wrapper bg-white p-4 p-md-5 rounded-4 shadow col-11 col-md-8 col-lg-6 col-xl-5">
        <h1 class="text-center mb-4 h2">Contacto</h1>
        <form action="#" method="POST">
          <div class="mb-3">
            <input type="text" class="form-control" id="nombre" placeholder="Nombre" required>
          </div>
          <div class="mb-3">
            <input type="email" class="form-control" id="mail" placeholder="Mail" required>
          </div>
          <div class="mb-3">
            <input type="tel" class="form-control" id="telefono" placeholder="Telefono">
          </div>
          <div class="mb-3">
            <textarea class="form-control" id="mensaje" rows="5" placeholder="Mensaje" required></textarea>
          </div>
          <button type="submit" class="btn btn-submit w-100 fs-5 p-2">Enviar</button>
        </form>
      </div>
    </div>
  </main>
  <footer class="footer-custom text-center py-3">
    <hr class="my-4">
  <p class="mb-0">&copy; Derechos Reservados Fabrizio Giordanelli y Agustin Granes</p>
</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
